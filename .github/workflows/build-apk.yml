name: Build TeleBot APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate Android Skeleton
        run: |
          flutter create . --platforms=android --org com.leotelebot.app --project-name telebot_app

      - name: Configure Android SDK Versions
        run: |
          sed -i 's/minSdkVersion = .*/minSdkVersion = 21/g' android/app/build.gradle || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TeleBot-Android-App
          path: build/app/outputs/flutter-apk/app-release.apk
